<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    min-height:100vh;

    font-family:'Poppins',sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#ffffff;

    overflow-x:hidden;

    background:
    linear-gradient(
        rgba(5,8,25,0.86),
        rgba(6,7,25,0.94)
    ),
    url("https://images.unsplash.com/photo-1531415074968-036ba1b575da?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    overscroll-behavior-y:auto;
}


/* Background Glow */

body::before{
    content:"";

    position:fixed;

    width:400px;
    height:400px;

    left:-150px;
    top:-120px;

    background:#00c8ff;

    filter:blur(160px);

    opacity:.12;

    pointer-events:none;
}


body::after{
    content:"";

    position:fixed;

    width:400px;
    height:400px;

    right:-150px;
    bottom:-120px;

    background:#7040ff;

    filter:blur(160px);

    opacity:.13;

    pointer-events:none;
}


/* Main Card */

.card{
    width:calc(100% - 34px);

    max-width:620px;

    min-height:700px;

    margin:30px 0;

    padding:55px 40px 40px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:rgba(15,17,43,.88);

    border:1px solid rgba(120,160,255,.18);

    border-radius:40px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        inset 0 0 50px rgba(70,100,255,.04);

    backdrop-filter:blur(15px);

    -webkit-backdrop-filter:blur(15px);

    position:relative;

    z-index:2;
}


/* Logo */

.logo{
    width:160px;

    height:160px;

    border-radius:50%;

    padding:5px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
    linear-gradient(
        135deg,
        #00d4ff,
        #4777ff,
        #7c35ff
    );

    box-shadow:
        0 0 25px rgba(0,190,255,.25);

    margin-bottom:30px;

    flex-shrink:0;
}


.logo img{
    width:100%;

    height:100%;

    object-fit:cover;

    border-radius:50%;

    border:4px solid #101329;

    display:block;
}


/* Heading */

h1{
    font-size:36px;

    line-height:1.15;

    font-weight:800;

    letter-spacing:-.5px;

    margin-bottom:20px;

    color:#ffffff;
}


/* Description */

.description{
    max-width:470px;

    font-size:16px;

    line-height:1.7;

    font-weight:600;

    color:#aeb2ce;

    margin-bottom:40px;
}


/* Telegram Button */

.join-btn{
    width:100%;

    max-width:500px;

    padding:19px 20px;

    border-radius:50px;

    display:block;

    text-decoration:none;

    color:#ffffff;

    font-size:16px;

    font-weight:800;

    background:
    linear-gradient(
        100deg,
        #00bfff,
        #4777ff,
        #813dff
    );

    box-shadow:
        0 12px 30px rgba(48,110,255,.28);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}


.join-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 15px 40px rgba(48,110,255,.42);
}


.join-btn:active{
    transform:scale(.98);
}


/* Footer */

.footer{
    margin-top:45px;

    font-size:14px;

    font-weight:600;

    color:#656a8c;
}


/* Mobile */

@media(max-width:600px){

    body{
        align-items:center;

        background-attachment:scroll;
    }


    .card{
        width:calc(100% - 34px);

        min-height:690px;

        margin:20px 0;

        padding:50px 28px 35px;

        border-radius:38px;
    }


    .logo{
        width:150px;

        height:150px;

        margin-bottom:28px;
    }


    h1{
        font-size:34px;

        font-weight:800;

        margin-bottom:19px;
    }


    .description{
        font-size:15px;

        line-height:1.65;

        font-weight:600;

        margin-bottom:37px;
    }


    .join-btn{
        padding:18px 16px;

        font-size:15px;

        font-weight:800;
    }


    .footer{
        margin-top:42px;

        font-size:13px;
    }

}


/* Small Phones */

@media(max-width:380px){

    .card{
        min-height:640px;

        padding:42px 22px 30px;
    }


    .logo{
        width:135px;

        height:135px;
    }


    h1{
        font-size:31px;
    }


    .description{
        font-size:14px;
    }


    .join-btn{
        font-size:14px;

        padding:17px 14px;
    }

}

</style>

<div class="card">


    <!-- TOSS EXPERT LOGO -->

    <div class="logo">

        <img

    </div>


    <!-- CHANNEL NAME -->

    <h1>
        TOSS EXPERT
    </h1>


    <!-- DESCRIPTION -->

    <div class="description">

        Get expert cricket insights and match analysis
        from TOSS EXPERT. Join our Telegram community
        for daily cricket updates.

    </div>


    <!-- TELEGRAM BUTTON -->

    <a
        href="https://t.me/+e7Rc7iOWbG8wZTll"
        class="join-btn"
        target="_blank"
        rel="noopener noreferrer"
    >

        JOIN TELEGRAM NOW

    </a>


    <!-- FOOTER -->

    <div class="footer">

        © 2026 TOSS EXPERT

    </div>


</div>


</body>
